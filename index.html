<!doctype html>
<html lang="ja" data-phase="focus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; form-action 'none'; base-uri 'none'">
  <title>ポモドーロタイマー</title>
  <style>
    :root {
      color-scheme: light;
      --background: #fcecf2;
      --card: #fffafd;
      --text: #26211e;
      --muted: #615852;
      --accent: #f5b8cc;
      --accent-text: #78384f;
      --accent-edge: #8b4761;
      --on-accent: #57283d;
      --tint: #fbe0ea;
      --line: #e9cdd8;
      font-family: system-ui, sans-serif;
    }
    :root[data-phase="break"] {
      --background: #e6f1e9;
      --card: #fafffb;
      --text: #1d2922;
      --muted: #475d50;
      --accent: #246349;
      --accent-text: var(--accent);
      --accent-edge: var(--accent);
      --on-accent: white;
      --tint: #e0eee4;
      --line: #cbdcd0;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100svh;
      margin: 0;
      padding: clamp(14px, 4vw, 36px);
      background: var(--background);
      color: var(--text);
      transition: background-color .25s;
    }
    main {
      width: min(100%, 490px);
      padding: clamp(18px, 5vw, 34px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--card);
      box-shadow: 0 12px 40px #201a1410;
    }
    header, .audio, .duration label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    h1 { margin: 0; font-size: clamp(1rem, 4.5vw, 1.2rem); }
    .count {
      color: var(--muted);
      font-size: .85rem;
      white-space: nowrap;
    }
    .count strong { color: var(--text); font-size: 1.1rem; }
    .dial {
      --progress: 100%;
      display: grid;
      width: min(100%, 276px);
      aspect-ratio: 1;
      margin: 24px auto 14px;
      padding: 7px;
      border-radius: 50%;
      background: conic-gradient(var(--accent) var(--progress), var(--tint) 0);
    }
    .dial-face {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 8px;
      border-radius: 50%;
      background: var(--card);
    }
    .phase {
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--tint);
      color: var(--accent-text);
      font-weight: 700;
    }
    .time {
      font-size: clamp(2.25rem, 12vw, 4.5rem);
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.06em;
      line-height: 1.1;
    }
    .notice {
      min-height: 2.8em;
      margin: 0 0 10px;
      color: var(--accent-text);
      font-size: .9rem;
      font-weight: 650;
      text-align: center;
    }
    .controls, .duration { display: grid; gap: 8px; }
    .controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .duration { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    button, input { font: inherit; }
    button {
      min-height: 46px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--card);
      color: var(--text);
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--accent-edge); }
    button:disabled { color: var(--muted); background: var(--tint); cursor: default; }
    #start:not(:disabled) { border-color: var(--accent-edge); background: var(--accent); color: var(--on-accent); }
    :focus-visible { outline: 2px solid var(--accent-edge); outline-offset: 3px; }
    fieldset { min-width: 0; margin: 22px 0 0; padding: 10px 0 0; border: 0; }
    legend { padding: 0; font-weight: 700; }
    .duration label {
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 6px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 11px;
      font-size: .85rem;
    }
    input[type="number"] {
      width: 4.1em;
      min-height: 34px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: .8rem; }
    .audio { margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
    .audio label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
    .audio button { padding-inline: 12px; }
    .switch {
      appearance: none;
      width: 42px;
      height: 24px;
      margin: 0;
      padding: 2px;
      border: 1px solid var(--muted);
      border-radius: 999px;
      background: var(--muted);
      cursor: pointer;
    }
    .switch::before { display: block; width: 18px; height: 18px; border-radius: 50%; background: white; content: ""; }
    .switch:checked { border-color: var(--accent-edge); background: var(--accent); }
    .switch:checked::before { transform: translateX(18px); background: var(--on-accent); }
    @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ポモドーロタイマー</h1>
      <span class="count">集中完了 <strong id="count">0</strong> 回</span>
    </header>

    <div class="dial" id="dial">
      <div class="dial-face">
        <span class="phase" id="phase">集中</span>
        <span class="time" id="time" role="timer" aria-label="残り時間">25:00</span>
      </div>
    </div>
    <p class="notice" id="notice" role="status">開始を押すとタイマーが動きます。</p>
    <div class="controls">
      <button type="button" id="start">開始</button>
      <button type="button" id="pause" disabled>一時停止</button>
      <button type="button" id="reset">リセット</button>
    </div>

    <fieldset aria-describedby="duration-hint">
      <legend>時間設定</legend>
      <div class="duration">
        <label>集中 <input type="number" id="focus-minutes" min="1" max="180" step="1" value="25"> 分</label>
        <label>休憩 <input type="number" id="break-minutes" min="1" max="180" step="1" value="5"> 分</label>
      </div>
      <p class="hint" id="duration-hint">各1〜180分。開始後の変更は次の区間から反映します。</p>
    </fieldset>

    <div class="audio">
      <label><input class="switch" type="checkbox" id="sound" role="switch" checked> 通知音</label>
      <button type="button" id="test-sound">テスト音</button>
    </div>
  </main>

  <script>
    'use strict';

    const byId = (id) => document.getElementById(id);
    const phaseDisplay = byId('phase');
    const timeDisplay = byId('time');
    const countDisplay = byId('count');
    const notice = byId('notice');
    const dial = byId('dial');
    const start = byId('start');
    const pause = byId('pause');
    const sound = byId('sound');
    const settings = { focus: 25, break: 5 };
    const phaseNames = { focus: '集中', break: '休憩' };
    const duration = (phase) => settings[phase] * 60_000;

    let phase = 'focus';
    let phaseDuration = duration(phase);
    let remaining = phaseDuration;
    let deadline = 0;
    let completed = 0;
    let interval = null;
    let state = 'ready';
    let audioContext;

    function render() {
      const seconds = Math.ceil(remaining / 1000);
      const minutesText = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secondsText = String(seconds % 60).padStart(2, '0');
      const time = `${minutesText}:${secondsText}`;
      if (timeDisplay.textContent !== time) timeDisplay.textContent = time;
      document.documentElement.dataset.phase = phase;
      phaseDisplay.textContent = phaseNames[phase];
      countDisplay.textContent = completed;
      dial.style.setProperty('--progress', `${remaining / phaseDuration * 100}%`);
      start.disabled = state === 'running';
      pause.disabled = state !== 'running';
    }

    async function enableAudio() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return false;
      try {
        audioContext ??= new AudioContext();
        if (audioContext.state !== 'running') await audioContext.resume();
        return audioContext.state === 'running';
      } catch {
        return false;
      }
    }

    function beep() {
      if (audioContext?.state !== 'running') return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;
      oscillator.type = 'sine';
      oscillator.frequency.value = 740;
      gain.gain.value = 0;
      const groupSpacing = 0.52;
      const beepSpacing = 0.11;
      const beepDuration = 0.07;
      for (let group = 0; group < 3; group += 1) {
        for (let pulse = 0; pulse < 3; pulse += 1) {
          const at = now + group * groupSpacing + pulse * beepSpacing;
          gain.gain.setValueAtTime(0, at);
          gain.gain.linearRampToValueAtTime(0.15, at + 0.008);
          gain.gain.linearRampToValueAtTime(0, at + beepDuration);
        }
      }
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 2 * groupSpacing + 2 * beepSpacing + beepDuration);
    }

    function tick() {
      if (state !== 'running') return;
      const now = Date.now();
      if (now >= deadline) {
        // Count whole cycles in one step after a long time in the background.
        const cycleDuration = duration('focus') + duration('break');
        const cycles = Math.floor((now - deadline) / cycleDuration);
        deadline += cycles * cycleDuration;
        completed += cycles;
        while (now >= deadline) {
          if (phase === 'focus') completed += 1;
          phase = phase === 'focus' ? 'break' : 'focus';
          phaseDuration = duration(phase);
          deadline += phaseDuration;
        }
        const finished = phase === 'break' ? '集中' : '休憩';
        notice.textContent = `${finished}が終了しました。${phaseNames[phase]}を開始します。`;
        if (sound.checked) beep();
      }
      remaining = Math.min(phaseDuration, deadline - now);
      render();
    }

    start.addEventListener('click', () => {
      if (state === 'running') return;
      if (sound.checked) void enableAudio();
      state = 'running';
      deadline = Date.now() + remaining;
      notice.textContent = `${phaseNames[phase]}中です。`;
      interval = window.setInterval(tick, 200);
      render();
    });

    pause.addEventListener('click', () => {
      if (state !== 'running') return;
      tick();
      window.clearInterval(interval);
      interval = null;
      state = 'paused';
      notice.textContent = '一時停止しました。';
      render();
    });

    byId('reset').addEventListener('click', () => {
      window.clearInterval(interval);
      interval = null;
      state = 'ready';
      phase = 'focus';
      phaseDuration = duration(phase);
      remaining = phaseDuration;
      notice.textContent = '集中タイマーをリセットしました。';
      render();
    });

    for (const name of Object.keys(settings)) {
      const input = byId(`${name}-minutes`);
      input.addEventListener('change', () => {
        const value = input.valueAsNumber;
        if (Number.isFinite(value)) {
          settings[name] = Math.max(Number(input.min), Math.min(Number(input.max), Math.round(value)));
        }
        input.value = settings[name];
        if (state === 'ready' && phase === name) {
          phaseDuration = duration(phase);
          remaining = phaseDuration;
          render();
        }
      });
    }

    sound.addEventListener('change', () => {
      if (sound.checked) void enableAudio();
    });

    byId('test-sound').addEventListener('click', async () => {
      if (await enableAudio()) {
        beep();
      } else {
        notice.textContent = 'このブラウザでは音を再生できませんでした。';
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) tick();
    });
    render();
  </script>
</body>
</html>
